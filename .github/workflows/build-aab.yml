name: Build AAB (Google Play)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Mesmas dependencias do workflow do APK (inclui o plugin de push)
      - name: Instalar dependencias
        run: npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor/push-notifications@6

      - name: Iniciar Capacitor se precisar
        run: test -f capacitor.config.json || npx cap init BRMove br.com.fretesbsb.brmove --web-dir www

      - name: Criar projeto Android
        run: |
          if [ ! -d android ]; then npx cap add android; fi

      # Icone do beija-flor (pasta resources/android/res do repositorio)
      - name: Aplicar icones do beija-flor
        run: |
          test -d resources/android/res || { echo "ERRO: pasta resources/android/res nao existe no repositorio"; exit 1; }
          find android/app/src/main/res -path '*mipmap*' -name 'ic_launcher*' -delete
          cp -r resources/android/res/. android/app/src/main/res/

      # Firebase + permissao de notificacao (Android 13+)
      - name: Configurar notificacoes (Firebase)
        run: |
          test -f google-services.json || { echo "ERRO: google-services.json nao existe na raiz do repositorio"; exit 1; }
          cp google-services.json android/app/google-services.json
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q "POST_NOTIFICATIONS" "$M"; then
            sed -i 's#<application#<uses-permission android:name="android.permission.POST_NOTIFICATIONS"/><application#' "$M"
          fi
          grep -n "POST_NOTIFICATIONS" "$M"

      - name: Sincronizar Capacitor
        run: npx cap sync android

      - name: Conferir plugin de push
        run: |
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q "PushNotifications" android/app/src/main/assets/capacitor.plugins.json || { echo "ERRO: plugin de push nao foi incluido"; exit 1; }

      - name: Definir minSdk 24 e target/compile SDK 36
        run: |
          V=android/variables.gradle
          if [ -f "$V" ]; then
            sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 24/" "$V"
            sed -i -E "s/compileSdkVersion = [0-9]+/compileSdkVersion = 36/" "$V"
            sed -i -E "s/targetSdkVersion = [0-9]+/targetSdkVersion = 36/" "$V"
            cat "$V"
          fi
          sed -i -E "s/minSdkVersion [0-9]+/minSdkVersion 24/; s/targetSdkVersion [0-9]+/targetSdkVersion 36/; s/compileSdkVersion [0-9]+/compileSdkVersion 36/" android/app/build.gradle || true
          echo "android.suppressUnsupportedCompileSdk=36" >> android/gradle.properties

      - name: Definir versionCode (numero do build)
        run: |
          F=android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" "$F"
          grep -n "versionCode\|versionName\|applicationId" "$F"

      - name: Gerar AAB (release)
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: Assinar AAB
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -f release.jks ]; then
            echo "Usando release.jks do repositorio"
            cp release.jks "$RUNNER_TEMP/release.jks"
          elif [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | tr -d ' \n\r\t"' | base64 -d > "$RUNNER_TEMP/release.jks"
          else
            echo "ERRO: sem release.jks na raiz do repositorio e secret KEYSTORE_BASE64 vazio"; exit 1
          fi
          keytool -list -keystore "$RUNNER_TEMP/release.jks" -storepass "$KEYSTORE_PASSWORD" | head -n 5
          AAB=$(ls android/app/build/outputs/bundle/release/*.aab | head -n1)
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 \
            -keystore "$RUNNER_TEMP/release.jks" \
            -storepass "$KEYSTORE_PASSWORD" -keypass "$KEY_PASSWORD" \
            "$AAB" "$KEY_ALIAS"
          jarsigner -verify "$AAB" | head -n 3
          cp "$AAB" brmove-cliente.aab
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: brmove-cliente-aab
          path: brmove-cliente.aab
