name: Gerar keystore (rodar so uma vez)

on:
  workflow_dispatch:
    inputs:
      senha:
        description: "Senha da keystore (minimo 8 caracteres, sem espacos, so letras e numeros)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias brmove \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.senha }}" -keypass "${{ inputs.senha }}" \
            -dname "CN=BRMove, OU=App, O=BRMove, L=Brasilia, ST=DF, C=BR"
          ls -l release.jks
          base64 -w 64 release.jks > keystore_base64.txt
          ls -l keystore_base64.txt
          # teste: decodifica de volta e confere
          base64 -d keystore_base64.txt > teste.jks
          keytool -list -keystore teste.jks -storepass "${{ inputs.senha }}" | head -n 6
          rm teste.jks

      - name: Mostrar base64 no log (copie daqui se o txt vier vazio)
        run: |
          echo "=====INICIO====="
          cat keystore_base64.txt
          echo
          echo "=====FIM====="

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-brmove
          path: |
            release.jks
            keystore_base64.txt
          retention-days: 1
