name: Gerar keystore (rodar so uma vez)

on:
  workflow_dispatch:
    inputs:
      senha:
        description: "Senha da keystore (minimo 8 caracteres, sem espacos)"
        required: true

jobs:
  keystore:
    runs-on: ubuntu-latest
    steps:
      - name: Gerar keystore
        run: |
          keytool -genkeypair -v -keystore release.jks -alias brmove \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ inputs.senha }}" -keypass "${{ inputs.senha }}" \
            -dname "CN=BRMove, OU=App, O=BRMove, L=Brasilia, ST=DF, C=BR"
          base64 -w0 release.jks > keystore_base64.txt

      - uses: actions/upload-artifact@v4
        with:
          name: keystore-brmove-GUARDE-E-APAGUE
          path: |
            release.jks
            keystore_base64.txt
          retention-days: 1
